{% extends "base.html" %}
    
{% block content %}
    <div style="position: fixed; inset: 0; display: flex; flex-direction: column;
        justify-content: center; align-items: center; text-align: center;
        gap: 12px; padding: 16px; pointer-events: none;">
    {% if current_user.role == "Banned" %}  
    <h1 style="color: red; margin: 0; font-family: 'Special Gothic Expanded One', system-ui, sans-serif; font-weight: 400; font-size: 5rem"> Account Banned </h1>

    <p style="margin: 0;">Your account has been banned from accessing this app.</p>

    <a href="{{url_for('auth.logout')}}" style="pointer-events: auto;">Log Out</a>
    {% else %}
        <p style="color: red; margin: 0; font-family: 'Special Gothic Expanded One', system-ui, sans-serif; font-weight: 400; font-size: 5rem"> This user has been banned. </p>
    {% endif %}
    </div>
{% endblock %}
