{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="tab">
        <button class="tabLinks" onclick="openTab(event, 'login')">Login</button>
        <button class="tabLinks" onclick="openTab(event, 'signup')">Sign Up</button>
    </div>    

    <div id="Login" class="tabcontent">
        <h3>Login</h3>
        <p>Please input your credentials to login.</p>
    </div>
    
    <div id="SignUp" class="tabcontent">
        <h3>Sign Up</h3>
        <p>Please input your credentials to sign up.</p>
    </div>
{% endblock %}
