{% extends "base.html" %}

{% block title %}Direct Message{% endblock %}

{% block content %}
    <h1>Direct Message with {{ receiver.username }}</h1>

    <div id="receiver" data-user="{{ receiver._id|string}}"></div>

    <label for="messaage">Message:</label>
    <input id="message" type="text" placeholder="Write a message">

    <button type="button" id="message-btn">Send</button>

    <div id="messages"></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/dms.js' )}}"></script>
{% endblock %}
