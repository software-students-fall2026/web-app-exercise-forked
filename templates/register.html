{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %} 
    <div>
        <h3>Sign Up</h3>
        <p>Please input your credentials to sign up.</p>
        <form action = "{{ url_for('auth.register') }}" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <input type="text" name="teach_skills" placeholder="Skills you can teach (comma separated)">
            <input type="text" name="learn_skills" placeholder="Skills you want to learn (comma separated)">

            <button type="submit">Sign Up</button>
        </form>
    </div>
    {% if error %}
    <p> {{error}} </p>
    {% endif %}
    
{% endblock %}
